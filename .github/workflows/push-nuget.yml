name: push-nuget

on:
  workflow_run:
    workflows: ["build"]
    types:
      - completed

env:
  NUGET_API_TOKEN: ${{ secrets.RWKVSHARP_NUGET_KEY }}

jobs:
  minor_release_to_nuget:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Setup NuGet
        uses: nuget/setup-nuget@v1
        with:
          nuget-api-key: $NUGET_API_TOKEN
          nuget-version: 'latest'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Push RWKVSharp packages to nuget.org
        run: dotnet nuget push artifacts/**/*.nupkg --source https://www.nuget.org -k ${{ secrets.RWKVSHARP_NUGET_KEY }} --skip-duplicate
 