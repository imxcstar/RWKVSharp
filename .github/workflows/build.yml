name: Build and Package RWKVSharp.Native
on:
  push:
    branches: [ dev ]
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
jobs:
  build:
    name: Build ${{ matrix.package }} (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CPU (All platforms)
          - package: Cpu
            os: ubuntu-22.04
            rid: linux-x64
            blas: OFF
            cublas: OFF
            hipblas: OFF
            metal: OFF
          - package: Cpu
            os: ubuntu-22.04
            rid: linux-arm64
            blas: OFF
            cublas: OFF
            hipblas: OFF
            metal: OFF
          - package: Cpu
            os: windows-2022
            rid: win-x64
            blas: OFF
            cublas: OFF
            hipblas: OFF
            metal: OFF
          - package: Cpu
            os: macos-14
            rid: osx-x64
            blas: OFF
            cublas: OFF
            hipblas: OFF
            metal: OFF
          - package: Cpu
            os: macos-14
            rid: osx-arm64
            blas: OFF
            cublas: OFF
            hipblas: OFF
            metal: OFF
          # OpenBLAS (Linux/Windows)
          - package: OpenBLAS
            os: ubuntu-22.04
            rid: linux-x64
            blas: ON
            cublas: OFF
            hipblas: OFF
            metal: OFF
          - package: OpenBLAS
            os: ubuntu-22.04
            rid: linux-arm64
            blas: ON
            cublas: OFF
            hipblas: OFF
            metal: OFF
          - package: OpenBLAS
            os: windows-2022
            rid: win-x64
            blas: ON
            cublas: OFF
            hipblas: OFF
            metal: OFF
          # cuBLAS (Linux/Windows with CUDA)
          - package: cuBLAS
            os: ubuntu-22.04
            rid: linux-x64
            blas: OFF
            cublas: ON
            hipblas: OFF
            metal: OFF
            cuda: 12.1
          - package: cuBLAS
            os: windows-2022
            rid: win-x64
            blas: OFF
            cublas: ON
            hipblas: OFF
            metal: OFF
            cuda: 11.8
          # Metal (macOS only)
          - package: Metal
            os: macos-14
            rid: osx-x64
            blas: OFF
            cublas: OFF
            hipblas: OFF
            metal: ON
          - package: Metal
            os: macos-14
            rid: osx-arm64
            blas: OFF
            cublas: OFF
            hipblas: OFF
            metal: ON
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # 确保子模块被初始化

      # CUDA Setup
      - name: Setup CUDA
        if: matrix.cuda
        uses: actions/setup-cuda@v2
        with:
          cuda-version: ${{ matrix.cuda }}

      # Install dependencies
      - name: Install dependencies
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential cmake ninja-build
            if [ "${{ matrix.blas }}" == "ON" ]; then
              sudo apt-get install -y libopenblas-dev
            fi
          elif [ "${{ runner.os }}" == "macOS" ]; then
            brew update
            brew install cmake ninja
            if [ "${{ matrix.blas }}" == "ON" ]; then
              brew install openblas
            fi
          elif [ "${{ runner.os }}" == "Windows" ]; then
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
            choco install ninja
          fi

      # Configure CMake
      - name: Configure CMake
        run: |
          cmake -S libs/rwkv.cpp -B build \
            -D RWKV_BUILD_SHARED_LIBRARY=ON \
            -D RWKV_OPENBLAS=${{ matrix.blas }} \
            -D RWKV_CUBLAS=${{ matrix.cublas }} \
            -D RWKV_HIPBLAS=OFF \
            -D RWKV_METAL=${{ matrix.metal }} \
            -D RWKV_ACCELERATE=OFF \
            -D CMAKE_BUILD_TYPE=Release

      # Build
      - name: Build
        run: cmake --build build --config Release --parallel

      # Collect artifacts
      - name: Collect artifacts
        run: |
          mkdir -p artifacts/runtimes/${{ matrix.rid }}/native
          if [ "${{ runner.os }}" == "Linux" ]; then
            cp build/bin/librwkv.so artifacts/runtimes/${{ matrix.rid }}/native/
          elif [ "${{ runner.os }}" == "macOS" ]; then
            cp build/bin/librwkv.dylib artifacts/runtimes/${{ matrix.rid }}/native/
          elif [ "${{ runner.os }}" == "Windows" ]; then
            cp build/bin/Release/rwkv.dll artifacts/runtimes/${{ matrix.rid }}/native/
          fi

      # Upload artifacts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.rid }}
          path: artifacts/
          retention-days: 1

  package:
    name: Create NuGet Packages
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [Cpu, OpenBLAS, cuBLAS, Metal]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ${{ matrix.package }}-*

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Create package structure
        run: |
          mkdir -p package/runtimes
          for artifact in artifacts/${{ matrix.package }}-*; do
            rid=${artifact#*-}
            mkdir -p "package/runtimes/$rid/native"
            cp -r $artifact/runtimes/$rid/native/* "package/runtimes/$rid/native/"
          done

      - name: Create .nuspec
        run: |
          cat > package/RWKVSharp.Native.${{ matrix.package }}.nuspec << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2013/05/nuspec.xsd">
            <metadata>
              <id>RWKVSharp.Native.${{ matrix.package }}</id>
              <version>1.0.0</version>
              <authors>xcssa</authors>
              <description>RWKV Native Library (${{ matrix.package }})</description>
              <packageTypes>
                <packageType name="Native" />
              </packageTypes>
            </metadata>
            <files>
              <file src="runtimes/**" target="runtimes" />
            </files>
          </package>
          EOF

      - name: Pack NuGet
        run: |
          cd package
          nuget pack RWKVSharp.Native.${{ matrix.package }}.nuspec -OutputDirectory ../out

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: RWKVSharp.Native.${{ matrix.package }}
          path: out/*
          retention-days: 1