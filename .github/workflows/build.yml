name: Build and Publish .NET Native Packages

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create new release'
        required: true
        type: boolean
  push:
    branches: [dev]

env:
  NUGET_VERSION: 1.0.0-${{ github.run_number }}
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  build_native:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # CPU Targets
          - package_id: RWKVSharp.Native.Cpu.avx.win-x64
            os: windows-2019
            arch: x64
            args: -DRWKV_AVX2=OFF
            rid: win-x64
            mode: avx
            type: cpu

          - package_id: RWKVSharp.Native.Cpu.avx2.win-x64
            os: windows-2019
            arch: x64
            rid: win-x64
            mode: avx2
            type: cpu

          - package_id: RWKVSharp.Native.Cpu.avx512.win-x64
            os: windows-2019
            arch: x64
            args: -DRWKV_AVX512=ON
            rid: win-x64
            mode: avx512
            type: cpu

          - package_id: RWKVSharp.Native.Cpu.avx.linux-x64
            os: ubuntu-latest
            arch: x64
            args: -DRWKV_AVX2=OFF
            rid: linux-x64
            mode: avx
            type: cpu

          - package_id: RWKVSharp.Native.Cpu.avx2.linux-x64
            os: ubuntu-latest
            arch: x64
            rid: linux-x64
            mode: avx2
            type: cpu

          - package_id: RWKVSharp.Native.Cpu.avx512.linux-x64
            os: ubuntu-latest
            arch: x64
            args: -DRWKV_AVX512=ON
            rid: linux-x64
            mode: avx512
            type: cpu

          - package_id: RWKVSharp.Native.Cpu.linux-arm64
            os: ubuntu-latest
            arch: arm64
            rid: linux-arm64
            type: cpu

          # cuBLAS Targets
          - package_id: RWKVSharp.Native.cuBLAS.win-x64
            os: windows-2019
            arch: x64
            args: -DRWKV_CUBLAS=ON
            rid: win-x64
            cuda: 12.2.0

          # Metal Targets
          - package_id: RWKVSharp.Native.Metal.osx-x64
            os: macOS-latest
            arch: x64
            args: -DRWKV_METAL=ON
            rid: osx-x64

          - package_id: RWKVSharp.Native.Metal.osx-arm64
            os: macOS-latest
            arch: arm64
            args: -DRWKV_METAL=ON
            rid: osx-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup CUDA
        if: matrix.cuda
        uses: Jimver/cuda-toolkit@v0.2.11
        with:
          cuda: ${{ matrix.cuda }}
          method: local

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake ../libs/rwkv.cpp ${{ matrix.args }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release --parallel

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare package structure (CPU)
        if: matrix.type == 'cpu' && matrix.arch != 'arm64'
        run: |
          mkdir -p package/runtimes/${{ matrix.rid }}/native/${{ matrix.mode }}
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp build/bin/Release/rwkv.dll package/runtimes/${{ matrix.rid }}/native/${{ matrix.mode }}/
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            cp build/librwkv.so package/runtimes/${{ matrix.rid }}/native/${{ matrix.mode }}/
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            cp build/librwkv.dylib package/runtimes/${{ matrix.rid }}/native/${{ matrix.mode }}/
          fi

      - name: Prepare package structure (CPU-arm64 or Other)
        if: matrix.type != 'cpu'
        run: |
          mkdir -p package/runtimes/${{ matrix.rid }}/native
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp build/bin/Release/rwkv.dll package/runtimes/${{ matrix.rid }}/native/
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            cp build/librwkv.so package/runtimes/${{ matrix.rid }}/native/
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            cp build/librwkv.dylib package/runtimes/${{ matrix.rid }}/native/
          fi

      - name: Create .nuspec
        run: |
          cat > package/${{ matrix.package_id }}.nuspec << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2010/07/nuspec.xsd">
            <metadata>
              <id>${{ matrix.package_id }}</id>
              <version>${{ env.NUGET_VERSION }}</version>
              <authors>xcssa</authors>
              <description>rwkv.cpp native library (${{ matrix.package_id }})</description>
              <packageTypes>
                <packageType name="Native" />
              </packageTypes>
            </metadata>
            <files>
              <file src="../package/runtimes/**" target="runtimes" />
            </files>
          </package>
          EOF
          
      - name: Pack NuGet
        run: |
          cd package
          dotnet pack ${{ matrix.package_id }}.nuspec -o ../nupkg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_id }}
          path: nupkg/*.nupkg

  create_release:
    if: ${{ ( github.event_name == 'push' && github.ref == 'refs/heads/master' ) || github.event.inputs.create_release == 'true' }}
    runs-on: ubuntu-latest
    needs: [build_native]
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.NUGET_VERSION }}
          name: Release v${{ env.NUGET_VERSION }}
          body: |
            RWKVSharp Native Packages
          files: artifacts/**/*.nupkg